<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>A-Frame Mixed Reality Grab Demo (Quest 3)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <script>
    /* ------------------------------------------------------------------
     * grabbable: marks an entity as something a controller can pick up.
     * Handles its own hover / grab highlight.
     * ------------------------------------------------------------------ */
    AFRAME.registerComponent('grabbable', {
      schema: {
        hoverColor: { type: 'color', default: '#444444' },
        grabColor:  { type: 'color', default: '#888888' }
      },
      init() {
        this.heldBy = null;          // controller entity currently holding this
        this.hoverCount = 0;         // number of controllers hovering
        this.originalParent = null;  // THREE.Object3D to return to on release
      },
      setHover(on) {
        this.hoverCount = Math.max(0, this.hoverCount + (on ? 1 : -1));
        this.refresh();
      },
      refresh() {
        const color = this.heldBy ? this.data.grabColor
                    : this.hoverCount > 0 ? this.data.hoverColor
                    : '#000000';
        this.el.setAttribute('material', 'emissive', color);
      }
    });

    /* ------------------------------------------------------------------
     * grabber: put on each motion controller. Squeeze the grip (or pull
     * the trigger) while the controller is touching a grabbable object to
     * pick it up; release to drop it where it is.
     * ------------------------------------------------------------------ */
    AFRAME.registerComponent('grabber', {
      schema: {
        reach: { type: 'number', default: 0.06 } // metres of slack around object bounds
      },
      init() {
        this.grabbed = null;
        this.hovered = null;
        this.box = new THREE.Box3();
        this.ctrlPos = new THREE.Vector3();
        this.objPos = new THREE.Vector3();

        this.onDown = this.onDown.bind(this);
        this.onUp = this.onUp.bind(this);
        ['gripdown', 'triggerdown'].forEach(e => this.el.addEventListener(e, this.onDown));
        ['gripup', 'triggerup'].forEach(e => this.el.addEventListener(e, this.onUp));
      },

      remove() {
        ['gripdown', 'triggerdown'].forEach(e => this.el.removeEventListener(e, this.onDown));
        ['gripup', 'triggerup'].forEach(e => this.el.removeEventListener(e, this.onUp));
      },

      // Nearest grabbable whose (slightly expanded) bounding box contains the controller.
      findTarget() {
        this.el.object3D.getWorldPosition(this.ctrlPos);
        let best = null, bestDist = Infinity;
        this.el.sceneEl.querySelectorAll('[grabbable]').forEach(el => {
          if (!el.object3D.visible) return;
          this.box.setFromObject(el.object3D).expandByScalar(this.data.reach);
          if (!this.box.containsPoint(this.ctrlPos)) return;
          el.object3D.getWorldPosition(this.objPos);
          const d = this.objPos.distanceTo(this.ctrlPos);
          if (d < bestDist) { bestDist = d; best = el; }
        });
        return best;
      },

      tick() {
        if (this.grabbed) return;
        const target = this.findTarget();
        if (target === this.hovered) return;
        if (this.hovered) this.hovered.components.grabbable.setHover(false);
        if (target) {
          target.components.grabbable.setHover(true);
          this.pulse(0.15, 15);
        }
        this.hovered = target;
      },

      onDown() {
        if (this.grabbed) return;
        const target = this.hovered || this.findTarget();
        if (!target) return;
        const g = target.components.grabbable;

        // If the other hand is holding it, hand it over.
        if (g.heldBy && g.heldBy !== this.el) g.heldBy.components.grabber.release();

        g.originalParent = g.originalParent || target.object3D.parent;
        g.heldBy = this.el;
        // attach() keeps the world transform, so the object doesn't jump.
        this.el.object3D.attach(target.object3D);
        this.grabbed = target;
        g.refresh();
        this.pulse(0.6, 40);
        target.emit('grab-start', { hand: this.el });
      },

      onUp() { this.release(); },

      release() {
        const target = this.grabbed;
        if (!target) return;
        const g = target.components.grabbable;
        (g.originalParent || this.el.sceneEl.object3D).attach(target.object3D);
        // Sync the A-Frame attributes with the new transform.
        const o = target.object3D;
        target.setAttribute('position', { x: o.position.x, y: o.position.y, z: o.position.z });
        target.setAttribute('rotation', {
          x: THREE.MathUtils.radToDeg(o.rotation.x),
          y: THREE.MathUtils.radToDeg(o.rotation.y),
          z: THREE.MathUtils.radToDeg(o.rotation.z)
        });
        g.heldBy = null;
        this.grabbed = null;
        g.refresh();
        this.pulse(0.3, 20);
        target.emit('grab-end', { hand: this.el });
      },

      // Controller vibration (guarded: not every browser exposes haptics).
      pulse(intensity, ms) {
        const tc = this.el.components['tracked-controls'];
        const gp = tc && tc.controller && tc.controller.gamepad;
        const act = gp && gp.hapticActuators && gp.hapticActuators[0];
        if (act && act.pulse) act.pulse(intensity, ms);
      }
    });

    /* ------------------------------------------------------------------
     * Show the help panel only outside immersive mode.
     * ------------------------------------------------------------------ */
    window.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      const help = document.getElementById('help');
      scene.addEventListener('enter-vr', () => { help.style.display = 'none'; });
      scene.addEventListener('exit-vr',  () => { help.style.display = ''; });
    });
  </script>

  <style>
    #help {
      position: fixed; left: 16px; top: 16px; z-index: 10; max-width: 340px;
      font: 14px/1.45 system-ui, sans-serif; color: #fff;
      background: rgba(0, 0, 0, 0.6); padding: 12px 14px; border-radius: 8px;
    }
    #help b { color: #ffd166; }
  </style>
</head>

<body>
  <div id="help">
    <b>Browser:</b> drag to look around, WASD to move.<br />
    <b>Quest 3:</b> press the <b>AR</b> button (bottom right) for Mixed Reality
    with passthrough, or <b>VR</b> for a fully virtual view.<br />
    Touch the box with a controller and squeeze <b>grip</b> (or trigger) to pick it up.
  </div>

  <!--
    xr-mode-ui XRMode: xr  -> shows both "VR" and "AR" buttons when supported.
    On Quest 3, AR = immersive-ar = colour passthrough of your room.
  -->
  <a-scene xr-mode-ui="XRMode: xr"
           webxr="optionalFeatures: hand-tracking"
           renderer="antialias: true; colorManagement: true">

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.9" position="1 3 2"></a-entity>

    <!-- Desktop / VR environment, removed automatically in AR so passthrough shows -->
    <a-sky color="#1f2937" hide-on-enter-ar></a-sky>
    <a-plane rotation="-90 0 0" width="20" height="20" color="#374151" hide-on-enter-ar></a-plane>

    <!-- Grabbable objects (within arm's reach of a standing user) -->
    <a-box id="box" grabbable
           position="0 1.2 -0.6" rotation="0 30 0"
           width="0.2" height="0.2" depth="0.2"
           material="color: #4f9dff; roughness: 0.4; metalness: 0.1">
    </a-box>

    <a-box grabbable
           position="0.35 1.1 -0.55"
           width="0.12" height="0.12" depth="0.12"
           material="color: #ff7a59; roughness: 0.5">
    </a-box>

    <a-sphere grabbable
              position="-0.35 1.1 -0.55" radius="0.07"
              material="color: #6ee7a8; roughness: 0.3">
    </a-sphere>

    <!-- Player rig: camera + both Quest Touch controllers -->
    <a-entity id="rig" position="0 0 0">
      <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
      <a-entity meta-touch-controls="hand: left"  grabber></a-entity>
      <a-entity meta-touch-controls="hand: right" grabber></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
